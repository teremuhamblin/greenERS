name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/enable-pull-request-automerge@v3
        with:
          merge-method: squash
